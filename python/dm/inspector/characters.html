<!doctype html>
<html lang="de">
<title>Buch der Namen</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Almendra+SC&family=Grenze+Gotisch:wght@500;700&family=IM+Fell+English:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Same palette and type as the story inspector. A list of people on the left, one sheet at a time on the right. */
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
a{color:var(--ember)}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:700 44px/1.05 var(--disp);margin:0 0 20px;text-wrap:balance}
h2{font:700 34px/1.1 var(--disp);margin:4px 0 2px}
h3{font:700 21px/1.2 var(--disp);margin:0 0 6px}
.label{font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.rail{position:static!important;max-height:none!important}}
.rail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:10px}
input{width:100%;box-sizing:border-box;font:14px var(--body);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:7px 9px}
input:focus-visible,a:focus-visible{outline:2px solid var(--ember);outline-offset:1px}
.group{margin-top:8px}
.who{display:block;padding:5px 8px;border-radius:3px;color:var(--ink);text-decoration:none}
.who{cursor:pointer}.who:hover{color:var(--ember);background:var(--chip)}.who[aria-current]{background:var(--chip);font-weight:600}
.who small{display:block;color:var(--soft);font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:20px 22px}
.role{font:500 18.5px/1.4 var(--disp);margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{font:12px var(--mono);padding:2px 6px;border-radius:3px;background:var(--chip);overflow-wrap:anywhere}.tag.w{background:var(--badbg);color:var(--bad)}
section{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.field{margin:0 0 12px;max-width:72ch}.field p{margin:0}
.name{font-weight:600}
details{margin-top:3px}summary{cursor:pointer;font:12px var(--mono);color:var(--soft)}
.ev{margin:4px 0 0;padding:0 0 0 12px;border-left:2px solid var(--ember);list-style:none;display:grid;gap:5px}
.ev q{font:italic 500 16px/1.35 var(--disp);quotes:none}
.key{display:block;font:11.5px var(--mono);color:var(--soft);overflow-wrap:anywhere}
.flag{background:var(--badbg);color:var(--bad);border-radius:3px;padding:10px 12px;margin-top:16px}.flag ul{margin:4px 0 0;padding-left:18px}
.meta{font:13px var(--mono);color:var(--soft)}
</style>
<link rel="stylesheet" href="/gothic.css">
<main class="wrap">
<nav class="topnav" aria-label="Seiten"><a href="/">Geschichten</a><a href="/map">Karte</a><a href="/characters">Figuren</a><a href="/experiment">Geschichtenprobe</a><span class="lang"><a href="?lang=en" hreflang="en">EN</a><a href="?lang=de" hreflang="de">DE</a></span></nav>
<h1>Das Buch der Namen</h1>
<div class="grid">
<aside class="rail"><input id="q" type="search" placeholder="Figuren und Tatsachen suchen" aria-label="Figuren und Tatsachen suchen"><nav id="list"></nav></aside>
<div id="view"><p class="meta">Lädt …</p></div>
</div>
</main>
<script>
const $=s=>document.querySelector(s), el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
const GROUPS=[["KDF","Feuermagier"],["NOV","Novizen"],["","Stadt und Hafen"]];
let DATA={characters:[],facts:[]};
const hay=x=>JSON.stringify(x).toLowerCase();
const current=()=>decodeURIComponent(location.hash.slice(1));
function quotes(items){const u=el("ul","ev");items.forEach(e=>{const l=el("li");l.append(el("q","",e.quote),el("span","key",e.key));u.append(l)});return u}
function evidence(s,about){const items=(s.evidence||[]).filter(e=>e.about===about);if(!items.length)return null;const d=el("details");d.append(el("summary","","Belege ("+items.length+")"),quotes(items));return d}
function field(s,about,name,text){const f=el("div","field");const p=el("p");if(name)p.append(el("span","name",name+": "));p.append(text);f.append(p);const ev=evidence(s,about);if(ev)f.append(ev);return f}
function section(title,fields){if(!fields.length)return null;const x=el("section");x.append(el("h3","",title),...fields);return x}
const entries=(s,o,path)=>Object.entries(o||{}).map(([k,v])=>field(s,path+"."+k,k,v));
function showSheet(s){const v=$("#view");v.textContent="";const b=el("article","sheet");
 if(s.error){b.append(el("h2","",s.file),el("div","flag","Diese Datei konnte nicht gelesen werden: "+s.error));v.append(b);return}
 const t=el("div","tags");[s.npc,"Stimme "+(s.voice||"?")].forEach(x=>t.append(el("span","tag",x)));
 if(!s.evidence)t.append(el("span","tag w","keine Belege"));
 if(s.invented&&s.invented.length)t.append(el("span","tag w",s.invented.length+" erfunden"));
 b.append(t,el("h2","",s.name||s.file),el("p","role",s.role||""));
 const a=s.attitudes||{},eye={novize:"Als Novize",feuermagier:"Als Feuermagier"},own=[];
 if(s.core)own.push(field(s,"core","",s.core));
 if(s.background)own.push(field(s,"background","Hintergrund",s.background));
 if(s.speech)own.push(field(s,"speech","Sprache",s.speech));
 const parts=[section("Wesen",own),
  section("Fraktionen",entries(s,a.factions,"attitudes.factions")),
  section("Personen",entries(s,a.people,"attitudes.people")),
  section("Politik",a.politics?[field(s,"attitudes.politics","",a.politics)]:[]),
  section("Spielstand",entries(s,s.game_state,"game_state")),
  section("Wie die Figur den Helden sieht",Object.entries(s.sees_hero||{}).map(([k,x])=>field(s,"sees_hero."+k,eye[k]||k,x))),
  section("Reagiert auf",entries(s,s.reacts_to,"reacts_to"))];
 parts.forEach(p=>p&&b.append(p));
 if(s.invented&&s.invented.length){const f=el("div","flag");f.append(el("strong","","Nicht durch die Zeilen der Figur belegt"));const u=el("ul");s.invented.forEach(i=>u.append(el("li","",i)));f.append(u);b.append(f)}
 v.append(b)}
function showFacts(){const v=$("#view");v.textContent="";const b=el("article","sheet"),q=$("#q").value.trim().toLowerCase();
 const facts=DATA.facts.filter(f=>!q||hay(f).includes(q)),topics=new Map();
 facts.forEach(f=>{if(!topics.has(f.about))topics.set(f.about,[]);topics.get(f.about).push(f)});
 b.append(el("div","label","Gemeinsames Wissen"),el("h2","","Weltwissen"),el("p","meta",facts.length+" von "+DATA.facts.length+" Tatsachen"));
 topics.forEach((items,topic)=>{const x=el("section");x.append(el("h3","",topic));items.forEach(f=>{const d=el("div","field");d.append(el("p","",f.fact),quotes([f]));x.append(d)});b.append(x)});
 v.append(b)}
function renderList(){const q=$("#q").value.trim().toLowerCase(),now=current(),n=$("#list");n.textContent="";
 const link=(id,name,sub)=>{const a=el("a","who",name);a.href="#"+encodeURIComponent(id);if(id===now)a.setAttribute("aria-current","page");if(sub)a.append(el("small","",sub));return a};
 n.append(link("world","Weltwissen",DATA.facts.length+" Tatsachen"));
 let shown=0;
 GROUPS.forEach(([prefix,title])=>{const people=DATA.characters.filter(s=>(s.npc||"").startsWith(prefix)&&(prefix||!GROUPS.some(g=>g[0]&&(s.npc||"").startsWith(g[0])))&&(!q||hay(s).includes(q)));if(!people.length)return;const g=el("div","group");g.append(el("div","label",title));people.forEach(s=>g.append(link(s.file,s.name||s.file,s.error?"unlesbar":s.role)));n.append(g);shown+=people.length});
 if(!shown&&q)n.append(el("p","meta","Keine Figur passt."))}
function route(){if(!current()&&DATA.characters.length){history.replaceState(null,"","#"+encodeURIComponent(DATA.characters[0].file))}
 const id=current(),rail=$(".rail"),kept=rail.scrollTop;renderList();rail.scrollTop=kept;
 if(id==="world")showFacts();else{const c=DATA.characters.find(x=>x.file===id);if(c)showSheet(c);else{$("#view").textContent="";$("#view").append(el("p","meta","Keine Figur ausgewählt."))}}
 const top=$("#view").getBoundingClientRect().top;if(top<0)window.scrollBy(0,top-16)}
$("#q").oninput=()=>{renderList();if(current()==="world")showFacts()};
addEventListener("hashchange",route);
fetch("/characters.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{DATA=d;route()}).catch(()=>{$("#view").textContent="";$("#view").append(el("p","meta","Die Figuren konnten nicht geladen werden. Läuft der Inspektor noch?"))});
</script>
